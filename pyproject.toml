[project]
name = "provingground-workspace"
version = "0.1.0"
description = "ProvingGround monorepo: AI evaluation, red-teaming and reliability platform"
requires-python = ">=3.12"
dependencies = [
    "provingground",
    "provingground-api",
    "provingground-demo-agents",
]

[project.optional-dependencies]
ml = ["provingground[ml]"]
adapters = ["provingground[adapters]"]
all = ["provingground[ml,adapters]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "services/api", "services/demo_agents"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
provingground = { workspace = true }
provingground-api = { workspace = true }
provingground-demo-agents = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["provingground", "pground_api", "demo_agents"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "services/demo_agents/tests", "services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "postgres: needs a running PostgreSQL (PGROUND_TEST_DATABASE_URL)",
    "ml: needs the [ml] extra (torch/transformers)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
