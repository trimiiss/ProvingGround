name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy packages/core/src services/demo_agents/src
      - name: Datasets are up to date
        run: |
          uv run python scripts/generate_datasets.py
          git diff --exit-code datasets/ || (echo "datasets/ is stale; run scripts/generate_datasets.py" && exit 1)
      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python-extras:
    # Real PyTorch NLI/classifier models plus DeepEval, Ragas and Inspect AI adapters.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install with extras (CPU-only torch)
        run: uv sync --frozen --extra ml --extra adapters
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - name: Test ML detectors and adapters
        run: uv run pytest packages/core/tests/test_selfcheck_ml.py packages/core/tests/test_adapters.py packages/core/tests/test_inspect_bridge.py
      - name: Detector precision/recall (pground doctor)
        run: uv run pground doctor --ml --target store-info-bot --suite customer-factuality,security-rag
