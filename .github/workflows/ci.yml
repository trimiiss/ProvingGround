name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy packages/core/src services/demo_agents/src services/api/src
      - name: Datasets are up to date
        run: |
          uv run python scripts/generate_datasets.py
          git diff --exit-code datasets/ || (echo "datasets/ is stale; run scripts/generate_datasets.py" && exit 1)
      - name: Test
        run: uv run pytest

  api:
    # API / queue / OTLP tests against a real PostgreSQL (skipped locally when none is running).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pground
          POSTGRES_PASSWORD: pground
          POSTGRES_DB: pground
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pground" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest services/api/tests

  stack:
    # The compose file parses and the image builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build -t provingground:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    # Whole stack in compose, a short seeded history, then the Playwright smoke test of the dashboard.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the stack
        run: docker compose up -d --build --wait api worker web
      - name: Seed a week of history
        run: docker compose --profile tools run --rm seed python scripts/seed.py --reset --days 8 --sample 5 --traffic-hours 3
      - name: Install Playwright
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: web
        env:
          PG_WEB_URL: http://localhost:3000
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200 api worker web

  python-extras:
    # Real PyTorch NLI/classifier models plus DeepEval, Ragas and Inspect AI adapters.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install with extras (CPU-only torch)
        run: uv sync --frozen --extra ml --extra adapters
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - name: Test ML detectors and adapters
        run: uv run pytest packages/core/tests/test_selfcheck_ml.py packages/core/tests/test_adapters.py packages/core/tests/test_inspect_bridge.py
      - name: Detector precision/recall (pground doctor)
        run: uv run pground doctor --ml --target store-info-bot --suite customer-factuality,security-rag
