name: quality-gate

# Blocks a pull request that makes an AI agent worse. Make the `quality-gate` job a *required*
# status check in branch protection to enforce it (Settings > Branches > main).
#
# It runs on every pull request (no `paths:` filter): a required check that never reports would
# leave unrelated PRs waiting forever. The gate itself is diff-aware, so a PR that changes no
# agent finishes in about a minute with nothing to evaluate.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the gate diffs against the base branch

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: ./.github/actions/provingground-gate
        with:
          base: origin/${{ github.base_ref }}
          policy: release
