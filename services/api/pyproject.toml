[project]
name = "provingground-api"
version = "0.1.0"
description = "ProvingGround platform server: REST API, OTLP trace ingest, worker, Prometheus metrics"
requires-python = ">=3.12"
dependencies = ["provingground"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pground_api"]
