[project]
name = "provingground-demo-agents"
version = "0.1.0"
description = "Demo company agents (the systems under test) for ProvingGround"
requires-python = ">=3.12"
dependencies = ["provingground", "pyyaml>=6.0", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_agents"]
