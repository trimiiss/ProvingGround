[project]
name = "provingground"
version = "0.1.0"
description = "ProvingGround evaluation engine and `pground` CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "numpy>=2.0",
    "jsonschema>=4.23",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openai>=1.50",
    "anthropic>=1,<2",
]

[project.scripts]
pground = "provingground.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provingground"]
