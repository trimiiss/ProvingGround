[project]
name = "provingground"
version = "0.1.0"
description = "ProvingGround evaluation engine and `pground` CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "numpy>=2.0",
    "jsonschema>=4.23",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openai>=1.50",
    "anthropic>=1,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local judges: NLI claim entailment, injection/toxicity classifiers, embeddings (CPU torch).
ml = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=5"]
# Third-party evaluation frameworks wrapped as optional scorers/runners.
adapters = ["deepeval>=3.0", "ragas>=0.4", "inspect-ai>=0.3.100"]

[project.scripts]
pground = "provingground.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provingground"]
