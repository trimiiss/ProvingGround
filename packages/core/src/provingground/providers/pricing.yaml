# Model prices in USD per 1M tokens.
#
# cache_read / cache_write default to 0.1x / 1.25x of `input` when omitted.
# Unknown models are priced as "unknown" (cost None), never as free.
# Anthropic prices: Claude API first-party rates (cached 2026-10). OpenAI prices: list prices
# as published in 2025 - verify against the provider before relying on them.
as_of: "2026-10"
models:
  # Simulated models (fictional prices, chosen to make the A/B/C trade-offs visible)
  sim/model-a: {input: 3.00, output: 15.00}
  sim/model-b: {input: 0.15, output: 0.60}
  sim/model-c: {input: 0.80, output: 4.00}
  sim/judge: {input: 0.0, output: 0.0}

  # Anthropic
  anthropic/claude-fable-5-1: {input: 10.00, output: 50.00, cache_read: 0.25}
  anthropic/claude-fable-5: {input: 10.00, output: 50.00}
  anthropic/claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
  anthropic/claude-opus-5: {input: 5.00, output: 25.00}
  anthropic/claude-opus-4-8: {input: 5.00, output: 25.00}
  anthropic/claude-opus-4-7: {input: 5.00, output: 25.00}
  anthropic/claude-opus-4-6: {input: 5.00, output: 25.00}
  anthropic/claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}
  anthropic/claude-sonnet-5: {input: 2.00, output: 10.00}
  anthropic/claude-sonnet-4-6: {input: 3.00, output: 15.00}
  anthropic/claude-haiku-5-5:
    input: 0.10
    output: 0.50
    long_context: {threshold_tokens: 100000, input: 0.50, output: 2.50}
  anthropic/claude-haiku-4-5: {input: 1.00, output: 5.00}

  # OpenAI (2025 list prices; OpenAI does not bill cache writes)
  openai/gpt-5: {input: 1.25, output: 10.00, cache_read: 0.125, cache_write: 1.25}
  openai/gpt-5-mini: {input: 0.25, output: 2.00, cache_read: 0.025, cache_write: 0.25}
  openai/gpt-5-nano: {input: 0.05, output: 0.40, cache_read: 0.005, cache_write: 0.05}
  openai/gpt-4.1: {input: 2.00, output: 8.00, cache_read: 0.50, cache_write: 2.00}
  openai/gpt-4.1-mini: {input: 0.40, output: 1.60, cache_read: 0.10, cache_write: 0.40}
  openai/gpt-4o: {input: 2.50, output: 10.00, cache_read: 1.25, cache_write: 2.50}
  openai/gpt-4o-mini: {input: 0.15, output: 0.60, cache_read: 0.075, cache_write: 0.15}

  # Local inference has no per-token price
  ollama/*: {input: 0.0, output: 0.0}
  vllm/*: {input: 0.0, output: 0.0}
